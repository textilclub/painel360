  .trilha a.feito b::after{content:" ✓";color:var(--gold-hi)}
  @media (max-width:760px){.trilha{grid-template-columns:repeat(7,minmax(108px,1fr));overflow-x:auto}}
  .card360{background:#0b0b0a;color:#fff;border-radius:18px;padding:26px 22px;border:2px solid var(--gold);margin:14px 0}
  .card360 .tt{font:800 clamp(1.3rem,1rem + 1.4vw,1.9rem)/1.1 var(--f-display);letter-spacing:-.02em;color:var(--gold-hi);margin-bottom:16px}
  .card360 dl{display:grid;gap:12px}.card360 dt{font:700 11.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-hi)}.card360 dd{margin:2px 0 0;font-size:17px;line-height:1.45;white-space:pre-wrap}

<body>
<script src="ui.js" data-page="visita"></script>
<main class="wrap">
  <section class="faixa fh"><div class="faixa-in">
    <div class="eyebrow" id="hEye"></div>
    <h1>Ferramentas <em>360°</em> com IA</h1>
    <p class="sub"><span id="hQtd"></span> Você preenche os dados da sua empresa, o Agente Estrategista analisa na hora e você registra o que decidiu. Cada ferramenta já recebe o que você decidiu nas anteriores.</p>
    <div id="quemF" style="margin-top:16px;color:var(--muted-dark);font-size:14.5px"></div>
  </div></section>

  <div class="page corpo">
    <div id="banner"></div>
    <nav class="dtabs" id="dtabs" aria-label="Dia"></nav>
    <nav class="trilha" id="trilha" aria-label="Trilha do Plano 2027"></nav>
    <div class="ftabs" role="tablist" id="ftabs"></div>
    <div id="tela"></div>
  </div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { montarAgente } from "./agente.js";
import { FER, DIAS_FER, tipoDia, numero, rotulos, registroTexto, pronto, faltaTexto, migrar, novaNota, notasTexto, calcular, calcTexto, preencher, LEG, trilha } from "./ferramentas-def.js";
import { montarObs } from "./obs.js";
const C = window.TC_CONFIG; const sb = createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, c) => (window.IC ? IC(n, c) : "");

// ---------- dia ----------
const qs = new URLSearchParams(location.search);
const hoje = new Date().toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" });
const DIA = DIAS_FER[qs.get("dia")] ? qs.get("dia") : (hoje >= "2026-11-20" ? "dia2" : "dia1");
const DD = DIAS_FER[DIA], ORDEM = DD.ordem, TIPO = tipoDia(DIA);
$("hEye").textContent = `${DD.nome} · ${DD.data} · ${DD.local}`;
$("hQtd").textContent = `${ORDEM.length} ferramentas para usar durante o dia.`;
const pq = qs.get("p");
$("dtabs").innerHTML = Object.entries(DIAS_FER).map(([k, d]) => `<a href="ferramentas.html?dia=${k}${pq ? "&p=" + encodeURIComponent(pq) : ""}"${k === DIA ? ' aria-current="page"' : ""}><b>${d.nome}</b><small>${d.data}</small></a>`).join("");

// ---------- sessão ----------
const { data:{ session } } = await sb.auth.getSession();
if (!session) { location.replace("index.html"); throw new Error("sem sessão"); }
const { data:adm } = await sb.rpc("is_admin"); if (adm && window.TC_UI) window.TC_UI.mostrarAdmin();
const { data:eu } = await sb.from("participantes").select("id,nome,status,empresa_id,empresas(nome)").eq("id", session.user.id).maybeSingle();
const alvoId = pq || eu?.id;
if (!alvoId) { location.replace(adm ? "admin.html" : "painel.html"); throw new Error("sem participante"); }
const RO = !(eu && eu.id === alvoId && eu.status === "aprovado");
if (RO && !adm && !(eu && eu.status === "aprovado")) { location.replace("painel.html"); throw new Error("sem acesso"); }
let alvo = eu;
if (alvoId !== eu?.id) { const { data } = await sb.from("participantes").select("id,nome,empresa_id,empresas(nome)").eq("id", alvoId).maybeSingle(); alvo = data; }
if (!alvo) { location.replace("painel.html"); throw new Error("não encontrado"); }
$("quemF").innerHTML = ic("building","sm") + " " + esc(alvo.nome) + (alvo.empresas?.nome ? " · " + esc(alvo.empresas.nome) : "");
if (RO) { document.body.classList.add("ro"); $("banner").innerHTML = `<div class="banner">Você está vendo as ferramentas de <b>${esc(alvo.nome)}</b> (somente leitura).${adm ? ` <a href="admin.html#acoes">Voltar ao administrador</a>` : ""}</div>`; }

const [{ data:regs }, { data:vis }, { data:exc }] = await Promise.all([
  sb.from("atividades").select("tipo,dados,atualizado_em").eq("participante_id", alvoId).in("tipo", ["fer_dia1","fer_dia2"]),
  sb.from("atividades").select("dados").eq("participante_id", alvoId).eq("tipo","visita").maybeSingle(),
  alvo.empresa_id ? sb.from("exercicios").select("regime,resumo").eq("empresa_id", alvo.empresa_id).maybeSingle() : Promise.resolve({ data:null })
]);
const reg = (regs||[]).find(r => r.tipo === TIPO);
const OUTRO = (regs||[]).find(r => r.tipo !== TIPO)?.dados || {};
const D = reg?.dados || {};
ORDEM.forEach(k => { D[k] = Object.assign({ in:{}, out:{}, chat:[], ok:false }, D[k] || {}); migrar(k, D[k], alvo.nome); });
// anotações dos sócios (mesma empresa, mesmo dia)
const { data:socRows } = alvo.empresa_id ? await sb.from("atividades").select("participante_id,dados,atualizado_em,participantes(nome)").eq("empresa_id", alvo.empresa_id).eq("tipo", TIPO).neq("participante_id", alvoId) : { data:[] };
const socio = r => { const d = r.dados || {}; ORDEM.forEach(k => { if (d[k]) migrar(k, d[k], r.participantes?.nome); }); return { id:r.participante_id, nome:r.participantes?.nome || "Sócio", dados:d }; };
const SOCIOS = (socRows||[]).map(socio);
// atualiza as anotações dos sócios sem recarregar a página (a cada 15 s e ao voltar para a aba)
let socAssin = JSON.stringify((socRows||[]).map(r => [r.participante_id, r.atualizado_em]));
async function atualizarSocios(forcar){
  if (!alvo.empresa_id) return;
  const { data } = await sb.from("atividades").select("participante_id,dados,atualizado_em,participantes(nome)").eq("empresa_id", alvo.empresa_id).eq("tipo", TIPO).neq("participante_id", alvoId);
  if (!data) return; const as = JSON.stringify(data.map(r => [r.participante_id, r.atualizado_em]));
  if (as === socAssin && !forcar) return; socAssin = as; SOCIOS.splice(0, SOCIOS.length, ...data.map(socio));
  if (modo === "gerais") tela(); else { const c = document.querySelector(".modos .cont"); if (c) c.textContent = contarGerais(atual); }
}
setInterval(() => { if (document.visibilityState === "visible") atualizarSocios(); }, 15000);
let modo = "minhas", incluirSocios = false;
const dadosDe = k => D[k] || OUTRO[k];
let atual = ORDEM.includes(location.hash.slice(1)) ? location.hash.slice(1) : (ORDEM.find(k => !D[k].ok) || ORDEM[0]);

// ---------- salvar ----------
let tmr = null;
function status(txt, ok){ const s=$("salvo"); if (s){ s.textContent=txt; s.className="salvo"+(ok?" ok":""); } }
let pendente = false;
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && pendente) salvar(true); else if (document.visibilityState === "visible") atualizarSocios(); });
window.addEventListener("pagehide", () => { if (pendente) salvar(true); });
function salvar(imediato){
  if (RO) return; clearTimeout(tmr); status("Salvando…"); pendente = true;
  tmr = setTimeout(async () => { pendente = false;
    const tudo = ORDEM.every(k => D[k].ok);
    const { error } = await sb.from("atividades").upsert({ participante_id: eu.id, tipo: TIPO, empresa_id: eu.empresa_id, dados: D,
      status: tudo ? "concluido" : "rascunho", atualizado_em: new Date().toISOString() });
    if (error) pendente = true;
    status(error ? "Não salvou: verifique a internet (tentando de novo…)" : "Salvo automaticamente · os sócios já podem ver", !error);
    if (error) setTimeout(() => { if (pendente) salvar(true); }, 5000);
  }, imediato ? 0 : 700);
}

// ---------- abas ----------
function abas(){
  $("ftabs").innerHTML = `<div class="lista">` + ORDEM.map((k,i) => `<button role="tab" type="button" data-t="${k}" aria-selected="${k===atual}"><b>${i+1}. ${FER[k].curto}</b><small class="${D[k].ok?"ok":""}">${D[k].ok?"✓ Concluída":"A fazer"}</small></button>`).join("") + `</div>`
    + `<div class="salvo" id="salvo">${reg?.atualizado_em ? "Salvo em " + new Date(reg.atualizado_em).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}) : (RO ? "" : "As respostas são salvas automaticamente")}</div>`;
  $("ftabs").querySelectorAll("[data-t]").forEach(b => b.onclick = () => { atual = b.dataset.t; history.replaceState(null,"","#"+atual); abas(); tela(); window.scrollTo({ top: $("ftabs").offsetTop - 130, behavior:"smooth" }); });
  $("ftabs").querySelector('[aria-selected="true"]')?.scrollIntoView({ block:"nearest", inline:"center" });
}

// ---------- entradas: várias anotações por tema ----------
const fmtTs = ts => ts ? new Date(ts).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}) : "";
function campoNota(k, gi, ei, c, n){
  const v = n.c?.[c.k] || { v:"", f:"" }, dis = RO ? "disabled" : "", at = `data-gi="${gi}" data-ei="${ei}" data-c="${c.k}"`;
  const rhp = c.f ? `<span class="rhp" role="group" aria-label="Tipo da informação">${["R","H","P"].map(f => `<button type="button" ${at} data-f="${f}" aria-pressed="${v.f===f}" title="${LEG[f][0]}: ${LEG[f][1]}" ${dis}>${f}</button>`).join("")}</span>` : "";
  let inp;
  if (c.tipo === "chk") { const sel = String(v.v||"").split(";").map(x => x.trim()).filter(Boolean);
    return `<div class="campo"><label><span>${c.l}</span></label><div class="chips" role="group">${c.op.map(o => `<button type="button" ${at} data-chk="${esc(o)}" aria-pressed="${sel.includes(o)}" ${dis}>${esc(o)}</button>`).join("")}</div></div>`; }
  if (c.tipo === "area") inp = `<textarea ${at} data-in="1" placeholder="${esc(c.ph||"")}" ${dis}>${esc(v.v)}</textarea>`;
  else if (c.tipo === "sel") inp = `<select ${at} data-in="1" ${dis}>${c.op.map(o => `<option value="${esc(o)}" ${String(v.v)===o?"selected":""}>${esc(c.opl?.[o] ?? (o===""?"Sem nota":o))}</option>`).join("")}</select>`;
  else inp = `<input ${at} data-in="1" value="${esc(v.v)}" placeholder="${esc(c.ph||"")}" ${c.num ? 'inputmode="decimal"' : ""} ${dis}>`;
  return `<div class="campo"><label><span>${c.l}</span>${rhp}</label>${inp}</div>`;
}
function grupoHTML(k, gi){
  const g = FER[k].grupos[gi], lista = D[k].g[gi], dis = RO ? "disabled" : "", item = g.item || "anotação";
  const notas = lista.map((n, ei) => `
    <div class="nota" data-nota="${gi}-${ei}">
      ${g.unico ? "" : `<div class="nota-cab"><span class="nota-n">${ei+1}</span><input class="nota-tit" data-tit="1" data-gi="${gi}" data-ei="${ei}" value="${esc(n.t||"")}" placeholder="Título curto (opcional). Ex.: Atrasos na costura" ${dis}>
        ${!RO && lista.length > 1 ? `<button type="button" class="nota-x" data-del="${gi}-${ei}" aria-label="Excluir esta ${item}" title="Excluir">${ic("trash","sm")}</button>` : ""}</div>`}
      <div class="campos ${g.dois?"dois":""}">${g.campos.map(c => campoNota(k, gi, ei, c, n)).join("")}</div>
      ${n.por || n.ts ? `<p class="autor">${esc(n.por||"")}${n.ts ? " · " + fmtTs(n.ts) : ""}</p>` : ""}
    </div>`).join("");
  return `<div class="grupo" id="grp-${gi}"><h3>${g.t}${!g.unico && lista.length > 1 ? `<span class="qtd">${lista.length} ${item === "linha" ? "linhas" : item === "gargalo" ? "gargalos" : "anotações"}</span>` : ""}</h3>${g.ajuda ? `<p class="g-ajuda">${g.ajuda}</p>` : ""}${notas}
    ${!RO && !g.unico ? `<button type="button" class="add-nota" data-add="${gi}">${ic("plus","sm")} Adicionar ${item === "linha" ? "outra linha de produto" : item === "gargalo" ? "outro gargalo" : "outra anotação sobre " + g.t}</button>` : ""}</div>`;
}
function ligarGrupo(k, gi){
  const el = $("grp-" + gi); if (!el) return;
  const nota = (g, e) => D[k].g[g][e];
  const tocar = n => { n.ts = new Date().toISOString(); n.por = eu?.nome || n.por; };
  el.querySelectorAll("[data-in]").forEach(x => x.addEventListener(x.tagName==="SELECT"?"change":"input", () => {
    const n = nota(+x.dataset.gi, +x.dataset.ei), c = x.dataset.c, cur = n.c[c] || { v:"", f:"" }; cur.v = x.value;
    if (!cur.f && x.value.trim()) { const h = x.closest(".campo").querySelector('[data-f="H"]'); if (h) { cur.f = "H"; x.closest(".campo").querySelectorAll(".rhp button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f==="H"))); } }
    n.c[c] = cur; tocar(n); salvar(); rcalc();
    if (k === "produto" && +x.dataset.gi === 1 && c === "nome") { const s = document.querySelector(`[data-rot="lin${x.dataset.ei}"]`); if (s) s.textContent = x.value.trim() || "Linha " + (+x.dataset.ei + 1); }
  }));
  el.querySelectorAll("[data-chk]").forEach(b => b.onclick = () => {
    const n = nota(+b.dataset.gi, +b.dataset.ei), c = b.dataset.c, cur = n.c[c] || { v:"", f:"" };
    const sel = String(cur.v||"").split(";").map(x => x.trim()).filter(Boolean), o = b.dataset.chk, i = sel.indexOf(o);
    if (i >= 0) sel.splice(i, 1); else sel.push(o);
    cur.v = sel.join("; "); n.c[c] = cur; tocar(n); b.setAttribute("aria-pressed", String(i < 0)); salvar(); rcalc(); });
  el.querySelectorAll("[data-tit]").forEach(x => x.addEventListener("input", () => { const n = nota(+x.dataset.gi, +x.dataset.ei); n.t = x.value; tocar(n); salvar(); }));
  el.querySelectorAll(".rhp button").forEach(b => b.onclick = () => {
    const n = nota(+b.dataset.gi, +b.dataset.ei), c = b.dataset.c, cur = n.c[c] || { v:"", f:"" }; cur.f = cur.f === b.dataset.f ? "" : b.dataset.f; n.c[c] = cur; tocar(n);
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.f === cur.f))); salvar(); rcalc(); });
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const [g, e] = b.dataset.del.split("-").map(Number); if (!confirm("Excluir esta anotação?")) return;
    D[k].g[g].splice(e, 1); salvar(); redesenhar(k, g); });
  el.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    const g = +b.dataset.add; D[k].g[g].push(novaNota(eu?.nome)); salvar(); redesenhar(k, g);
    const ult = $("grp-" + g).querySelectorAll(".nota"); ult[ult.length-1]?.scrollIntoView({ behavior:"smooth", block:"center" }); ult[ult.length-1]?.querySelector("textarea,input:not(.nota-tit)")?.focus({ preventScroll:true }); });
}
function redesenhar(k, gi){ const el = $("grp-" + gi); el.outerHTML = grupoHTML(k, gi); ligarGrupo(k, gi); }

// ---------- dados para a IA ----------
const brl = v => "R$ " + Math.round(v||0).toLocaleString("pt-BR");
function dadosIA(k){
  const F = FER[k];
  const linhas = F.grupos.map((g, gi) => `${g.t.toUpperCase()}\n` + notasTexto(F, gi, D[k].g[gi])).join("\n\n");
  let extra = "";
  if (incluirSocios) SOCIOS.forEach(so => { const d = so.dados[k]; if (!d?.g) return;
    const tx = F.grupos.map((g, gi) => { const t = notasTexto(F, gi, d.g[gi], { autor:true, pularVazio:true }); return t ? `${g.t.toUpperCase()}\n${t}` : ""; }).filter(Boolean).join("\n\n");
    const out = registroTexto(k, d);
    if (tx || out) extra += `\n\nANOTAÇÕES DO SÓCIO ${so.nome.toUpperCase()} (mesma empresa)\n${tx}${out ? "\nRegistro de saída do sócio:\n" + out : ""}`; });
  (F.usa || []).forEach(u => { const tx = registroTexto(u, dadosDe(u)); if (tx) extra += `\n\nREGISTRO ANTERIOR — ${FER[u].nome} (decisões registradas pelo empresário)\n${tx}`; });
  if (F.visita && vis?.dados?.areas) {
    const lac = Object.values(vis.dados.areas).filter(a => (a.eu||"").trim() && a.nivel != null && a.nivel <= 1).map(a => `- ${a.eu.trim()}`);
    const ac = (vis.dados.acoes||[]).filter(a => (a.o||"").trim()).map(a => `- ${a.o.trim()}${a.p?" ("+a.p+")":""}`);
    if (lac.length || ac.length) extra += `\n\nREGISTRO ANTERIOR — VISITA TÉCNICA (18/11)\nLacunas que identifiquei na minha empresa:\n${lac.join("\n")||"- —"}\nAções que me comprometi a fazer:\n${ac.join("\n")||"- —"}`;
  }
  const ct = calcTexto(k, D[k], dadosDe); if (ct) extra += "\n\n" + ct;
  if (exc?.resumo?.receita) extra += `\n\nREGISTRO ANTERIOR — PLANEJAMENTO 2027 (exercício de casa; é PROJEÇÃO, não histórico)\n- Regime: ${exc.regime==="presumido"?"Lucro Presumido":"Simples Nacional"}\n- Faturamento projetado 2027: [H] ${brl(exc.resumo.receita)}\n- Resultado projetado 2027: [H] ${brl(exc.resumo.resultado)}`;
  return `MÓDULO ${F.nome}

=== DADOS DA EMPRESA ===
Empresa: ${alvo.empresas?.nome || ""}
Participante: ${alvo.nome || ""}
Legenda: [R] dado real · [H] hipótese · [P] dado pendente

${linhas}${extra}`;
}

// ---------- registro de saída ----------
function saidaHTML(k){
  const F = FER[k], o = D[k].out, dis = RO ? "disabled" : "";
  const ctl = (key, c) => c.tipo === "sel"
    ? `<select data-out="${key}" aria-label="${esc(c.l)}" ${dis}>${c.op.map(x => `<option value="${esc(x)}" ${String(o[key]||"")===x?"selected":""}>${x===""?"Escolha":esc(c.opl?.[x] ?? x)}</option>`).join("")}</select>`
    : `<input data-out="${key}" value="${esc(o[key]||"")}" placeholder="${esc(c.ph||"")}" ${dis}>`;
  return F.out.map(bl => {
    if (bl.tipo === "campo") return `<div class="campo" style="margin-bottom:12px"><label>${bl.l}</label><textarea data-out="${bl.b}" placeholder="${esc(bl.ph||"")}" ${dis}>${esc(o[bl.b]||"")}</textarea></div>`;
    const rot = rotulos(F, bl, D[k]), um = bl.cols.length === 1;
    const tit = bl.tf ? bl.tf(o) : bl.t;
    if (um) return `<div class="grupo"><h3>${esc(tit)}</h3><div class="campos">${rot.map((r,i) => `<div class="campo"><label>${bl.rot ? esc(r) : `${bl.cols[0].l} ${i+1}`}</label>${ctl(`${bl.b}${i}_${bl.cols[0].k}`, bl.cols[0])}</div>`).join("")}</div></div>`;
    return `<div class="grupo"><h3>${esc(tit)}</h3><div class="campos">${rot.map((r,i) => `
      <div class="grupo" style="background:var(--surface);margin:0"><h3><span class="k">${bl.rot ? "•" : i+1}</span><span data-rot="${bl.b}${i}">${esc(bl.rot || bl.rotIn ? r : `${bl.cols[0].l.split(" (")[0]} ${i+1}`)}</span></h3>
        <div class="linha-out">${bl.cols.map(c => `<div class="campo"><label>${c.l}</label>${ctl(`${bl.b}${i}_${c.k}`, c)}</div>`).join("")}${bl.calc ? `<div class="receita" data-rec="${bl.b}${i}"></div>` : ""}</div></div>`).join("")}</div>
      ${bl.calc ? `<p class="receita" style="margin-top:10px" data-tot="${bl.b}"></p>` : ""}</div>`;
  }).join("");
}
function calcOrc(k){
  FER[k].out.filter(bl => bl.calc).forEach(bl => {
    let tot = 0; const o = D[k].out;
    for (let i = 0; i < bl.n; i++) { const q = numero(o[`${bl.b}${i}_q`]), p = numero(o[`${bl.b}${i}_pr`]), el = document.querySelector(`[data-rec="${bl.b}${i}"]`);
      const r = q > 0 && p > 0 ? q * p : 0; tot += r; if (el) el.textContent = r ? "Receita: " + brl(r) : ""; }
    const t = document.querySelector(`[data-tot="${bl.b}"]`); if (t) t.textContent = tot ? "Receita total orçada: " + brl(tot) : "";
  });
}

  desenharTrilha();
  const usados = (F.usa || []).filter(u => registroTexto(u, dadosDe(u))).map(u => FER[u].nome);

      <div class="legenda">${["R","H","P"].map(f => `<span title="${LEG[f][1]}"><b class="t-${f}">${f}</b>${LEG[f][0]} <small style="color:var(--muted)">(${LEG[f][1].toLowerCase()})</small></span>`).join("")}</div>

      ${!RO && SOCIOS.some(so => so.dados[k]) ? `<label class="socios-ia"><input type="checkbox" id="incSoc" ${incluirSocios?"checked":""}> Incluir as anotações dos sócios (${SOCIOS.filter(so => so.dados[k]).map(so => esc(so.nome.split(" ")[0])).join(", ")}) na análise</label>` : ""}

    <section class="passo"><header><span class="n">3</span><div><h2>Registro de saída</h2><p>Depois da análise da IA e da discussão na mesa, registre aqui só o que <b>você</b> decidiu. É isso que segue para as próximas ferramentas.</p></div></header>
      ${saidaHTML(k)}

    </section>`}`;
  $("tela").querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { modo = b.dataset.modo; tela(); if (modo === "gerais") atualizarSocios(true); });
  montarObs({ el: $("obsF"), sb, empresaId: alvo.empresa_id, participanteId: alvo.id, alvos: ["fer:" + k], rotuloAlvo: F.nome, admin: !!adm });
  if (modo === "gerais") return;
  montarAgente({ el: $("agente"), sb, modulo: k, ro: RO, dados: () => dadosIA(k), conversa: () => D[k].chat, salvar: c => { D[k].chat = c; salvar(); } });
  const inc = $("incSoc"); if (inc) inc.onchange = () => { incluirSocios = inc.checked; };
  F.grupos.forEach((g, gi) => ligarGrupo(k, gi));

  calcOrc(k); fim(); rcalc();

function baixarCard(){
  const o = D.compromisso?.out || {}, W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
  g.fillStyle = "#0b0b0a"; g.fillRect(0, 0, W, H); g.fillStyle = "#B8912F"; g.fillRect(0, 0, W, 14); g.fillRect(0, H - 14, W, 14);
  const quebra = (txt, x, y, larg, lh, max) => { const pal = String(txt || "—").split(/\s+/); let l = "", n = 0;
    for (const p of pal) { const t2 = l ? l + " " + p : p; if (g.measureText(t2).width > larg && l) { g.fillText(l, x, y); y += lh; l = p; if (++n >= max - 1) break; } else l = t2; }
    g.fillText(l, x, y); return y + lh; };
  g.fillStyle = "#E3C77A"; g.font = "800 72px Poppins, Arial"; let y = 150; ["ESCREVA.", "ASSUMA.", "EXECUTE."].forEach(w => { g.fillText(w, 80, y); y += 82; });
  y += 40;
  [["A DECISÃO MAIS IMPORTANTE DO MEU PLANO 2027", o.dec], ["O QUE ACONTECE NOS PRÓXIMOS 7 DIAS", o.sete], ["RESPONSÁVEL POR INICIAR", o.resp]].forEach(([r, v]) => {
    g.fillStyle = "#E3C77A"; g.font = "700 26px Arial"; g.fillText(r, 80, y); y += 52; g.fillStyle = "#ffffff"; g.font = "500 38px Arial"; y = quebra(v, 80, y, W - 160, 50, 5) + 34; });
  g.fillStyle = "#BDB299"; g.font = "600 24px Arial"; g.fillText(`${alvo.empresas?.nome || ""} · Imersão Método Confecção 360° · Têxtil Club`, 80, H - 70);
  const a = document.createElement("a"); a.download = "compromisso-360.png"; a.href = cv.toDataURL("image/png"); a.click();
}

// ---------- anotações gerais da empresa ----------
function todos(){ return [{ id: alvo.id, nome: alvo.nome, dados: D, eu: true }, ...SOCIOS]; }
function contarGerais(k){
  const F = FER[k], t = x => String(x||"").trim();
  return todos().reduce((s, p) => s + (p.dados[k]?.g ? F.grupos.reduce((a, g, gi) => a + (p.dados[k].g[gi]||[]).filter(n => t(n.t) || g.campos.some(c => t(n.c?.[c.k]?.v))).length, 0) : 0), 0);
}
function geraisHTML(k){
  const F = FER[k], t = x => String(x||"").trim(), P = todos();
  const blocos = F.grupos.map((g, gi) => {
    const itens = [];
    P.forEach(p => (p.dados[k]?.g?.[gi] || []).forEach(n => { if (t(n.t) || g.campos.some(c => t(n.c?.[c.k]?.v))) itens.push({ p, n }); }));
    itens.sort((a, b) => String(b.n.ts||"").localeCompare(String(a.n.ts||"")));
    return `<div class="grupo"><h3>${g.t}<span class="qtd">${itens.length}</span></h3>${itens.length ? itens.map(({ p, n }) => `
      <div class="nota ger ${p.eu ? "minha" : ""}"><p class="quem-anotou"><b>${esc(p.eu && !RO ? "Você" : (n.por || p.nome))}</b>${n.ts ? " · " + fmtTs(n.ts) : ""}${t(n.t) ? ` · <i>${esc(n.t)}</i>` : ""}</p>
        <dl>${g.campos.filter(c => t(n.c?.[c.k]?.v)).map(c => `<dt>${c.l}${n.c[c.k].f ? ` <b class="t-${n.c[c.k].f}">${n.c[c.k].f}</b>` : ""}</dt><dd>${esc(n.c[c.k].v)}</dd>`).join("")}</dl></div>`).join("")
      : `<p class="sub" style="font-size:14px">Ninguém da empresa anotou sobre ${g.t} ainda.</p>`}</div>`;
  }).join("");
  const regs = P.map(p => { const r = registroTexto(k, p.dados[k]); return r ? `<div class="nota ger ${p.eu ? "minha" : ""}"><p class="quem-anotou"><b>${esc(p.eu && !RO ? "Você" : p.nome)}</b>${p.dados[k]?.ok ? " · ✓ concluiu" : ""}</p><pre class="reg">${esc(r)}</pre></div>` : ""; }).join("");
  return `<section class="passo"><header><span class="n">${ic("users","sm")}</span><div><h2>Tudo o que a empresa anotou em ${F.nome}</h2><p>${P.length > 1 ? `Anotações de ${P.map(p => esc(p.eu && !RO ? "você" : p.nome.split(" ")[0])).join(", ")}, das mais recentes para as mais antigas.` : "Por enquanto só você da sua empresa anotou aqui. Quando um sócio anotar, aparece aqui com o nome dele."}</p></div></header>
    ${blocos}
    <div class="grupo"><h3>Registros de saída</h3>${regs || `<p class="sub" style="font-size:14px">Ninguém registrou a saída ainda.</p>`}</div></section>`;
}

function fim(){
  const k = atual, el = $("fim"); if (!el) return;
  const extra = FER[k].onepage ? `<div class="botoes"><button class="btn ghost" type="button" id="bImp">${ic("download","sm")}Imprimir / salvar PDF do One Page</button></div>` : FER[k].card ? cardHTML() : "";
  if (D[k].ok) el.innerHTML = `<div class="feito">${ic("check")}Ferramenta concluída. Você ainda pode ajustar o registro.</div>${extra}${RO?"":proximo(k)}`;
  else if (RO) el.innerHTML = `<p class="sub">Ainda não concluiu esta ferramenta.</p>${extra}`;
  else {
    el.innerHTML = `<button class="btn" id="bOk" type="button" style="width:auto">Concluir ${FER[k].nome}</button><p class="hint" id="hOk">${pronto(k, D[k]) ? "" : faltaTexto(k)}</p>${extra}`;
    $("bOk").onclick = () => { if (!pronto(k, D[k])) { $("hOk").className = "hint warn"; return; } D[k].ok = true; salvar(); abas(); fim(); };
  }
  const bi = $("bImp"); if (bi) bi.onclick = imprimirOnePage;
  const bc = $("bCard"); if (bc) bc.onclick = baixarCard;
}
function proximo(k){
  const i = ORDEM.indexOf(k), n = ORDEM[i+1];
  if (n) return `<div class="botoes"><button class="btn ghost" type="button" data-prox="${n}">Ir para ${FER[n].nome}</button></div>`;
  return DIA === "dia1" ? `<div class="botoes"><a class="btn ghost" href="ferramentas.html?dia=dia2${pq?"&p="+encodeURIComponent(pq):""}">Ir para as ferramentas do 2º dia</a></div>` : "";
}
document.addEventListener("click", e => { const b = e.target.closest("[data-prox]"); if (b) document.querySelector(`[data-t="${b.dataset.prox}"]`)?.click(); });

// ---------- One Page para imprimir ----------
function imprimirOnePage(){
  const o = D.onepage?.out || {}, t = x => esc(String(x || "").trim()) || "—";
  const lst = (b, n, c) => [...Array(n).keys()].map(i => o[`${b}${i}_${c}`]).filter(x => String(x||"").trim());
  const tab = (b, n, cols) => `<table><tr>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr>${[...Array(n).keys()].filter(i => cols.some(c => String(o[`${b}${i}_${c[0]}`]||"").trim())).map(i => `<tr>${cols.map(c => `<td>${t(o[`${b}${i}_${c[0]}`])}</td>`).join("")}</tr>`).join("")}</table>`;
  const w = window.open("", "_blank");
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>One Page 2027 · ${esc(alvo.empresas?.nome||"")}</title>
  <style>body{font:13px/1.45 Arial,sans-serif;color:#0b0b0a;margin:28px}h1{font-size:22px;margin:0}h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#76560B;margin:16px 0 6px;border-bottom:1.5px solid #0b0b0a;padding-bottom:3px}
  .top{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #B8912F;padding-bottom:10px}.top img{height:44px}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.nums div{border:1px solid #BDB299;border-radius:6px;padding:8px;min-height:38px}
  table{width:100%;border-collapse:collapse}th,td{border:1px solid #BDB299;padding:5px 7px;text-align:left;vertical-align:top}th{background:#F4EFE4}ol{margin:0;padding-left:18px}.ex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ex div{border:1px solid #BDB299;border-radius:6px;padding:7px}.ex b{display:block;font-size:11px;color:#76560B}
  .rod{margin-top:18px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#76560B;text-align:center}</style></head><body>
  <div class="top"><div><div style="font-size:11px;letter-spacing:.14em;color:#76560B">CONFECÇÃO 360°</div><h1>Plano Estratégico 2027</h1><div>Empresa: <b>${esc(alvo.empresas?.nome||"")}</b> · ${esc(alvo.nome||"")}</div></div><img src="${location.origin}/logo.jpg" alt=""></div>
  <h2>Visão de futuro</h2><div>${t(o.visao)}</div>
  <h2>Os cinco números de 2027</h2><div class="nums">${[0,1,2,3,4].map(i => `<div>${t(o[`num${i}_v`])}</div>`).join("")}</div>
  <h2>Prioridades estratégicas</h2><ol>${lst("pri",5,"v").map(x => `<li>${esc(x)}</li>`).join("")||"<li>—</li>"}</ol>
  ${[0,1,2].some(i => String(o[`marca${i}_v`]||"").trim()) ? `<h2>Marca e produto</h2><div>${["Posicionamento","Direção de produto","Portfólio"].map((r,i) => `<div><b>${r}:</b> ${t(o[`marca${i}_v`])}</div>`).join("")}</div>` : ""}
  <h2>Metas e indicadores</h2>${tab("kpi",4,[["o","Objetivo"],["m","Meta"],["k","KPI"]])}
  <h2>Projetos estratégicos</h2>${tab("pj",4,[["p","Projeto"],["r","Responsável"],["z","Prazo"]])}
  <h2>Execução</h2><div class="ex">${["7 dias","30 dias","60 dias","90 dias"].map((r,i) => `<div><b>${r}</b>${t(o[`ex${i}_v`])}</div>`).join("")}</div>
  <h2>Maior risco e compromisso do dono</h2><div><b>Maior risco:</b> ${t(o.risco)}</div><div style="margin-top:4px"><b>Compromisso:</b> ${t(o.comp)}</div>
  <div class="rod">Têxtil Club · Imersão Método Confecção 360°</div>
  <script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
  w.document.close();
}

abas(); tela();
</script>
</body>
