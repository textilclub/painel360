<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cronograma · Imersão Método Confecção 360°</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  .cab .faixa-in{padding-bottom:70px}
  .cab h1{margin:10px 0 8px}
  .cr{max-width:860px}
  .dias{position:relative;z-index:3;margin-top:-34px;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:5px 5px 0 var(--gold)}
  .dias button{min-height:68px;padding:10px 6px;background:none;border:0;border-left:1.5px solid var(--ink);color:var(--ink);display:grid;gap:2px;justify-items:center;align-content:center}
  .dias button:first-child{border-left:0}
  .dias .dt{font:700 clamp(1.15rem,1rem + 1vw,1.5rem)/1 var(--f-display);letter-spacing:-.03em}
  .dias .nm{font:500 13.5px var(--f-body);color:var(--muted)}
  .dias button[aria-selected="true"]{background:var(--ink)}
  .dias button[aria-selected="true"] .dt{color:var(--gold-hi)}
  .dias button[aria-selected="true"] .nm{color:#fff}
  .dias button:not([aria-selected="true"]):hover{background:var(--paper)}

  .dia-cab{margin:34px 0 8px}
  .obj-t{font:600 clamp(1.3rem,1.05rem + 1.3vw,1.85rem)/1.25 var(--f-display);letter-spacing:-.02em;margin:12px 0 26px;max-width:30ch}
  .saida{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 20px 8px}
  .saida h2{font:600 12.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:6px}
  .saida ol{list-style:none;counter-reset:s}
  .saida li{counter-increment:s;display:grid;grid-template-columns:38px 1fr;gap:10px;padding:13px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.45}
  .saida li:first-child{border-top:0}
  .saida li::before{content:counter(s,decimal-leading-zero);font:700 15px/1.5 var(--f-display);color:var(--gold-ink);letter-spacing:-.01em}
  @media (min-width:760px){.saida ol{display:grid;grid-template-columns:1fr 1fr;column-gap:34px}.saida li:nth-child(2){border-top:0}}

  .loc{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r-lg);padding:20px;margin:0 0 24px}
  .loc .ico{width:48px;height:48px;border-radius:12px;background:var(--ink);color:var(--gold-hi);display:grid;place-items:center;flex:0 0 auto}
  .loc .k{font:600 12.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
  .loc h2{font-size:1.3rem;margin:4px 0}
  .loc .la{font-size:15px;color:var(--muted);margin-bottom:16px;max-width:46ch}
  .loc .bts{display:flex;gap:10px;flex-wrap:wrap}
  @media (max-width:520px){.loc{flex-direction:column}.loc .bts .btn{width:100%}}

  .tl{position:relative;margin-top:30px;padding-left:52px}
  .tl::before{content:"";position:absolute;left:17px;top:10px;bottom:10px;border-left:2px dashed var(--line-2)}
  .mod{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;margin-bottom:16px}
  .mod::before{content:attr(data-n);position:absolute;left:-52px;top:16px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font:700 14px var(--f-display);display:grid;place-items:center;box-shadow:0 0 0 5px var(--paper)}
  .mod.case{border:1.5px solid var(--ink)}
  .mod h3{font:600 clamp(1.05rem,1rem + .4vw,1.2rem)/1.3 var(--f-display);letter-spacing:-.015em;margin-bottom:8px}
  .mod .tag{display:inline-flex;align-items:center;gap:6px;font:700 11.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--ink);border-radius:999px;padding:5px 11px;margin-bottom:10px}
  .mod .oq{font-size:15.5px;color:var(--ink-2);line-height:1.6}
  .mod .ef{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--gold-soft);font-size:15.5px;line-height:1.55;color:var(--ink)}
  .mod .ef b{display:flex;align-items:center;gap:8px;font:700 11.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:5px}
  .pausa{position:relative;display:flex;align-items:center;gap:12px;margin:2px 0 18px;font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .pausa::before{content:"";position:absolute;left:-41px;top:50%;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--line-2);transform:translateY(-50%);box-shadow:0 0 0 5px var(--paper)}
  .pausa::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 11px)}
  .breve{text-align:center;color:var(--muted);padding:44px 14px;border:2px dashed var(--line-2);border-radius:var(--r-lg);margin-top:30px}
  @media (max-width:520px){
    .tl{padding-left:44px}.tl::before{left:13px}
    .mod::before{left:-44px;width:32px;height:32px;font-size:13px}
    .pausa::before{left:-35px}
    .mod{padding:18px 16px 16px}
  }
</style>
</head>
<body>
<script src="ui.js" data-page="cronograma"></script>
<main class="wrap">
  <section class="faixa cab"><div class="faixa-in">
    <div class="eyebrow">Imersão Método Confecção 360°</div>
    <h1>Cronograma</h1>
    <p class="sub">Três dias. Cada módulo mostra o que vai acontecer e o efeito que isso tem na sua confecção.</p>
  </div></section>
  <div class="page cr">
    <div class="dias" id="dias" role="tablist" aria-label="Dias da imersão"></div>
    <div id="conteudo" aria-live="polite"></div>
  </div>
</main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const C = window.TC_CONFIG; const sb = createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
const { data:{ session } } = await sb.auth.getSession();
if (!session) { location.replace("index.html"); throw new Error("sem sessão"); }

const DIAS = [
  { nome:"Visita técnica", data:"Quarta, 18/11", rot:"da visita técnica", rotSaida:"Você vai entregar",
    local:{ nome:"Siqueira Gaipo", end:"R. Pres. José Linhares, 806 · Jardim Presidente, Goiânia - GO · CEP 74353-240", tel:"Suporte: Rafael Martins · (62) 8229-2141", telLink:"556282292141",
            mapa:"https://www.google.com/maps/search/?api=1&query=Siqueira%20Gaipo%2C%20R.%20Pres.%20Jos%C3%A9%20Linhares%2C%20806%2C%20Jardim%20Presidente%2C%20Goi%C3%A2nia" },
    objetivo:"Observar uma operação industrial de perto, identificar boas práticas e oportunidades de melhoria que você possa aplicar na sua própria confecção.",
    saida:["3 pontos fortes que você observou na operação.","3 oportunidades de melhoria.","3 ações práticas para implementar na sua empresa."],
    itens:[
      { pausa:"Recepção" },
      { t:"Briefing de observação",
        o:"Antes de entrar na fábrica, você recebe um roteiro do que observar: fluxo, organização, gargalos, gestão visual e pessoas.",
        e:"Você deixa de \"passear\" pela fábrica e passa a enxergar como um consultor, percebendo detalhes que normalmente passam batido." },
      { t:"Visita técnica guiada", tag:"Na prática",
        o:"Um percurso guiado por dentro de uma operação industrial real, do recebimento da matéria-prima até a expedição.",
        e:"Você vê funcionando na prática o que só conhecia na teoria e volta com referências concretas do que é possível na sua fábrica." },
      { pausa:"Pausa e deslocamento" },
      { t:"Reflexão individual", tag:"Mão na massa",
        o:"Um momento só seu para comparar o que viu com a realidade da sua empresa e anotar pontos fortes, oportunidades e ações.",
        e:"As ideias saem da cabeça e vão para o papel antes de se perderem, já traduzidas para a sua realidade." },
      { t:"Debrief 360°",
        o:"Conversa em grupo para compartilhar o que cada um observou e organizar os aprendizados da visita.",
        e:"Você enxerga a mesma fábrica pelos olhos de outros empresários e sai com ideias que sozinho não teria percebido." },
      { t:"Compromisso da visita",
        o:"Cada participante escolhe as ações práticas que vai levar para a própria empresa.",
        e:"A visita não fica só na inspiração: você já chega à imersão com ações definidas e a cabeça aquecida para os dois dias." },
    ]},
  { nome:"1º dia", data:"Quinta, 19/11",
    objetivo:"Diagnosticar a sua empresa e identificar as principais alavancas de crescimento.",
    saida:["O diagnóstico dos seis pilares da sua confecção.","Os principais gargalos da sua produção.","A equação da sua meta comercial.","Decisões sobre marca e portfólio.","Decisões estratégicas consolidadas para alimentar o seu planejamento de 2027."],
    itens:[
      { pausa:"Credenciamento e café de boas-vindas" },
      { t:"Abertura: sua confecção em 2027 começa agora",
        o:"O ponto de partida da imersão: para onde o mercado de confecção está indo e por que o resultado de 2027 se decide agora, e não em janeiro.",
        e:"Você sai do modo \"apagar incêndio\" e passa a enxergar o próximo ano como um projeto que está nas suas mãos." },
      { t:"Raio-X Confecção 360°",
        o:"Um diagnóstico guiado dos seis pilares que sustentam uma confecção, feito sobre a realidade da sua empresa.",
        e:"Clareza imediata de onde o dinheiro está escapando e de qual pilar vai puxar o seu crescimento primeiro." },
      { t:"Produção e processos",
        o:"Fluxo produtivo, organização da fábrica, tempos e gargalos: como a produção realmente funciona por dentro.",
        e:"Você descobre onde a sua produção trava e sai com ações para produzir mais com a mesma equipe, sem aumentar custo." },
      { t:"Equipamentos e produtividade",
        o:"Como a tecnologia e os equipamentos certos multiplicam a capacidade de uma confecção.",
        e:"Você passa a olhar máquina como investimento com retorno calculado, e não como gasto." },
      { t:"Case 360°: operação", tag:"Caso real",
        o:"Uma confecção real que reorganizou a operação, mostrada passo a passo: o antes, as decisões e o depois.",
        e:"Ver acontecendo na prática tira a dúvida do \"será que funciona aqui?\" e mostra por onde começar na sua fábrica." },
      { pausa:"Almoço" },
      { t:"Quanto custa cada venda? CAC, comissão e OTE",
        o:"O custo real do seu comercial, o CAC, três jeitos de comissionar, o OTE do vendedor (meta, gatilho e acelerador), bonificação por comportamento e os cuidados trabalhistas.",
        e:"Você sai com a conta de quanto custa cada venda e com uma nova regra de comissão para o seu time, feita com os números da sua confecção na calculadora da plataforma." },
      { t:"Inteligência artificial aplicada ao comercial",
        o:"Uso prático de IA no atendimento, no follow-up e na rotina de vendas de uma confecção.",
        e:"Você sai sabendo usar IA para responder mais rápido, não deixar cliente esfriar e vender mais sem aumentar a equipe." },
      { pausa:"Coffee break" },
      { t:"Marca e produto",
        o:"Posicionamento, portfólio e mix de produtos: o que a sua marca representa e o que vale a pena fabricar.",
        e:"Decisões firmes sobre o que manter, o que cortar e o que lançar, e uma marca mais fácil de lembrar e de escolher." },
      { t:"Case 360°: integrado", tag:"Caso real",
        o:"Um caso real em que produção, vendas e marca foram trabalhados juntos.",
        e:"Você entende como os pilares se conectam e por que, quando andam juntos, o resultado se multiplica em vez de somar." },
      { t:"Painel de decisões do dia 1",
        o:"Momento de consolidar, com apoio dos mentores, tudo o que foi decidido ao longo do dia.",
        e:"Você não sai só inspirado: sai com decisões escritas, prontas para virar o seu planejamento de 2027." },
      { t:"Fechamento e orientações",
        o:"Amarração do dia e preparação para o segundo dia da imersão.",
        e:"Você chega ao segundo dia com a cabeça organizada e pronto para transformar decisão em plano." },
    ]},
  { nome:"2º dia", data:"Sexta, 20/11",
    objetivo:"Construir o seu Plano Estratégico Confecção 360° para 2027.",
    saida:["SWOT priorizada e escolhas estratégicas.","Orçamento comercial de 2027.","Orçamento de resultado e capacidade produtiva.","Objetivos e KPIs estratégicos.","Projetos prioritários, cada um com responsável.","Plano de execução de 30, 60 e 90 dias.","Plano auditado com apoio de inteligência artificial.","One Page Strategic Plan 2027: o seu plano em uma página.","Compromisso de execução."],
    itens:[
      { pausa:"Recepção e café" },
      { t:"Abertura: as 3 decisões do dia 1",
        o:"Retomada das três decisões mais importantes que você tomou no primeiro dia, para que elas guiem tudo o que será construído hoje.",
        e:"O plano de 2027 nasce em cima das suas decisões, e não de uma folha em branco. Nada do que você descobriu ontem se perde." },
      { t:"Liderança e pessoas",
        o:"Como liderar, desenvolver e engajar a equipe de uma confecção, do chão de fábrica ao comercial.",
        e:"Você enxerga onde a equipe está travando o crescimento e sai com ações para ter pessoas mais comprometidas e menos dependentes de você." },
      { t:"O papel do planejamento estratégico",
        o:"Por que empresas que planejam crescem com mais segurança, e como um plano sai do papel e entra na rotina.",
        e:"O planejamento deixa de ser \"coisa de empresa grande\" e vira a ferramenta que vai te dar tranquilidade para decidir em 2027." },
      { t:"Gestão e financeiro",
        o:"Os números que um dono de confecção precisa dominar: margem, custo, caixa e resultado.",
        e:"Você passa a decidir olhando números, não só intuição, e descobre quanto a sua empresa realmente ganha em cada venda." },
      { t:"SWOT 360° e escolhas estratégicas", tag:"Mão na massa",
        o:"Análise de forças, fraquezas, oportunidades e ameaças da sua empresa, transformada em escolhas claras para 2027.",
        e:"Você sai sabendo no que apostar e, tão importante quanto, o que deixar de fazer para não desperdiçar energia." },
      { pausa:"Almoço" },
      { t:"A importância de sistemas e dados",
        o:"Como sistemas de gestão e dados organizados mudam a forma de controlar produção, estoque e vendas.",
        e:"Você entende quais informações precisa ter na mão e para de depender de planilhas soltas e da memória para decidir." },
      { t:"Orçamento comercial 2027", tag:"Mão na massa",
        o:"Construção da sua meta de vendas para 2027, mês a mês, a partir do seu exercício de casa.",
        e:"Você sai com a meta do ano calculada e dividida por mês, e sabe exatamente o que precisa vender para chegar lá." },
      { t:"Orçamento de resultado e capacidade", tag:"Mão na massa",
        o:"O quanto essa meta gera de lucro e se a sua fábrica dá conta de produzir o que foi planejado.",
        e:"Você sabe, antes do ano começar, se o plano dá lucro e se cabe na sua produção. Sem surpresas no meio do caminho." },
      { pausa:"Coffee break" },
      { t:"Objetivos, KPIs e projetos", tag:"Mão na massa",
        o:"Definição dos objetivos estratégicos, dos indicadores que vão medir o progresso e dos projetos prioritários, cada um com responsável.",
        e:"Cada pessoa da empresa vai saber o que precisa entregar e como será medida. O plano deixa de depender só de você." },
      { t:"Plano 30/60/90 dias", tag:"Mão na massa",
        o:"Os primeiros passos do plano organizados nos próximos 30, 60 e 90 dias.",
        e:"Você volta para a empresa sabendo exatamente o que fazer já na segunda-feira, sem perder o embalo da imersão." },
      { t:"Auditoria de IA: teste de estresse",
        o:"O seu plano passa por um teste com inteligência artificial, que procura pontos fracos, riscos e inconsistências.",
        e:"Você corrige as falhas antes que elas virem prejuízo e sai com um plano mais robusto e realista." },
      { t:"One Page Strategic Plan 2027",
        o:"Todo o planejamento consolidado em uma única página: objetivos, metas, indicadores e projetos.",
        e:"Você leva para casa o plano de 2027 em uma página, fácil de mostrar para a equipe e de acompanhar todo mês." },
      { t:"Compromisso 360° e encerramento",
        o:"Fechamento da imersão com o compromisso de execução de cada empresário.",
        e:"Você sai com um compromisso assumido e um plano em mãos. A imersão termina, mas a transformação da sua confecção começa ali." },
    ]},
];
let d = 0;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  document.getElementById("dias").innerHTML = DIAS.map((x,i)=>{ const [sem,dt] = x.data.split(", "); return `<button type="button" role="tab" aria-selected="${i===d}" data-i="${i}"><span class="dt">${dt}</span><span class="nm">${x.nome}</span></button>`; }).join("");
  document.querySelectorAll("#dias button").forEach(b=>b.onclick=()=>{ d=+b.dataset.i; render(); });
  const D = DIAS[d]; let n = 0;
  document.getElementById("conteudo").innerHTML = !D.itens.length ? `<div class="breve">${IC("calendar","lg")}<p style="margin-top:8px">A programação do ${D.nome} será liberada em breve.</p></div>` : `
    <div class="dia-cab">
      <div class="eyebrow">${esc(D.data)}</div>
      <h2 class="obj-t" style="margin-bottom:22px"><span class="sr">Objetivo ${esc(D.rot||"do "+D.nome)}: </span>${esc(D.objetivo)}</h2>
    </div>
    ${D.local?`<div class="loc"><span class="ico">${IC("pin","lg")}</span><div><div class="k">Local da visita</div><h2>${esc(D.local.nome)}</h2><div class="la">${esc(D.local.end)}</div><div class="bts"><a class="btn sm" href="${D.local.mapa}" target="_blank" rel="noopener">${IC("pin","sm")}Abrir no mapa</a><a class="btn sm ghost" href="https://wa.me/${D.local.telLink}" target="_blank" rel="noopener">${IC("chat","sm")}${esc(D.local.tel)}</a></div></div></div>`:""}
    <section class="saida"><h2>${D.rotSaida||"Você vai sair com"}</h2><ol>${D.saida.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>
    <div class="tl">${D.itens.map(it => it.pausa ? `<div class="pausa">${IC("coffee","sm")}${esc(it.pausa)}</div>` : `
      <article class="mod ${it.tag?"case":""}" data-n="${++n}">${it.tag?`<span class="tag">${esc(it.tag)}</span>`:""}<h3>${esc(it.t)}</h3>
        <p class="oq">${esc(it.o)}</p><div class="ef"><b>${IC("spark","sm")}Efeito colateral positivo</b>${esc(it.e)}</div></article>`).join("")}</div>`;
}
render();
</script>
</body>
</html>
